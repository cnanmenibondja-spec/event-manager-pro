    var ms = teamMissions(ev, t.id), f = teamFin(ev, t), vals = { _team: t.alloc };
    var fields = [{ type: 'note', k: '_n', html: '<b>' + esc(t.name) + '</b> demande <b>' + fmtMoney(f.req) + '</b> au total. Indiquez ce que vous accordez. L\'équipe le voit sur sa page.' },
      { k: '_team', label: 'Enveloppe pour toute l\'équipe (€)', type: 'money', hint: 'Facultatif. Laissez vide pour additionner les montants accordés aux missions.' }];
    ms.forEach(function (m) {
      vals['a_' + m.id] = m.alloc;
      fields.push({ k: 'a_' + m.id, label: m.title + (m.req ? ' · demandé ' + fmtMoney(m.req) + (m.reqDate ? ' pour le ' + fmtDate(m.reqDate) : '') : ''), type: 'money', half: true });
    });
    openForm('Budget accordé', fields, vals, function (v) {
      t.alloc = v._team;
      ms.forEach(function (m) { m.alloc = v['a_' + m.id]; });
      var nf = teamFin(ev, t);
      log(ev, 'a accordé ' + fmtMoney(nf.alloc) + ' à l\'équipe « ' + t.name + ' ».');
      toast('Budget enregistré : ' + fmtMoney(nf.alloc) + ' pour « ' + t.name + ' ».');
    });
    var bar0 = $('#m-form .m-actions-row');
    if (bar0 && ms.some(function (m) { return m.req; })) bar0.insertAdjacentHTML('afterbegin', '<button type="button" class="btn btn-sm" data-act="alloc-all">Accorder tout ce qui est demandé</button>');
  }

  function formSub(ev, m, s) {
    openForm('Modifier la tâche', [
      { k: 'title', label: 'Tâche', req: true }, { k: 'who', label: 'Qui s\'en occupe ?', half: true, list: teamNames(teamOf(ev, m.teamId)), hint: 'Choisissez un membre ou tapez un nom.' }, { k: 'due', label: 'Pour quand ?', type: 'date', half: true },
      { k: 'done', label: 'Faite', type: 'checkbox' }
    ], s, function (v) {
      var was = s.done; Object.assign(s, v);
      if (was && !s.done) resetOk(ev, m.teamId, 'une tâche a été décochée');
    }, { onDelete: function () { m.subtasks = m.subtasks.filter(function (x) { return x.id !== s.id; }); } });
  }

  function teamNames(t) { return t ? [t.lead].concat(t.people.map(function (p) { return p.name; })).filter(Boolean) : []; }

  function formProg(ev, p) {
    var days = daysRange(ev.start, ev.end);
    openForm(p ? 'Modifier le moment' : 'Ajouter un moment', [
      { k: 'day', label: 'Jour', type: 'select', options: days.map(function (d, i) { return [d, 'Jour ' + (i + 1) + ' · ' + fmtDate(d)]; }), def: days[0] },
      { k: 'start', label: 'Début', type: 'time', req: true, half: true }, { k: 'end', label: 'Fin', type: 'time', half: true },
      { k: 'title', label: 'Quoi ?', req: true, ph: 'Ex. : Louange, enseignement, pause…' },
      { k: 'teamId', label: 'Équipe responsable', type: 'select', options: teamOptions(ev, true) },
      { k: 'notes', label: 'Remarque', type: 'textarea', rows: 2 }
    ], p, function (v) {
      if (p) Object.assign(p, v); else ev.program.push(Object.assign({ id: uid('p'), done: false }, v));
    }, p ? { onDelete: function () { ev.program = ev.program.filter(function (x) { return x.id !== p.id; }); } } : null);
  }

  function formExp(ev, x, teamId) {
    var own = !isOrg();
    var fields = [
      { k: 'what', label: 'Qu\'est-ce qui a été acheté ?', req: true },
      { k: 'amount', label: 'Montant (€)', type: 'number', req: true, half: true }, { k: 'date', label: 'Date', type: 'date', half: true, def: today() },
      { k: 'who', label: 'Payé par', req: true, half: true, list: teamId || (x && x.teamId) ? teamNames(teamOf(ev, teamId || x.teamId)) : [] },
      own ? { type: 'note', k: '_t', html: 'Équipe : <b>' + esc((teamOf(ev, myTeam()) || {}).name || '') + '</b>' } : { k: 'teamId', label: 'Équipe', type: 'select', options: teamOptions(ev, true), half: true, def: teamId || '' },
      { k: 'receipt', label: x && x.receiptId ? 'Remplacer la photo du ticket' : 'Photo du ticket (facultatif)', type: 'file', accept: 'image/*,application/pdf', hint: 'Prenez le ticket en photo. Il reste sur cet appareil.' }
    ];
    if (!own) fields.push({ k: 'reimbursed', label: 'Déjà remboursé', type: 'checkbox' });
    openForm(x ? 'Modifier la dépense' : 'Nouvelle dépense', fields, x, function (v) {
      var file = v.receipt; delete v.receipt;
      if (own) v.teamId = myTeam();
      var target = x;
      if (x) Object.assign(x, v);
      else { target = Object.assign({ id: uid('x'), reimbursed: false }, v); ev.expenses.push(target); log(ev, 'a noté une dépense : ' + v.what + ' (' + fmtMoney(v.amount) + ').'); }
      if (v.teamId) resetFin(ev, v.teamId, 'nouvelle dépense notée');
      if (file) {
        var rid = uid('r');
        Files.put(rid, file).then(function () { if (target.receiptId) Files.del(target.receiptId).catch(function () {}); target.receiptId = rid; target.receiptName = file.name; save(); render(); toast('Ticket enregistré.'); })
          .catch(function () { toast('Impossible d\'enregistrer la photo du ticket.'); });
      }
    }, x ? { onDelete: function () {
      if (x.receiptId) Files.del(x.receiptId).catch(function () {});
      ev.expenses = ev.expenses.filter(function (e) { return e.id !== x.id; });
      if (x.teamId) resetFin(ev, x.teamId, 'une dépense a été supprimée');
    } } : null);
  }

  function formContrib(ev, c) {
    openForm(c ? 'Modifier la contribution' : 'Nouvelle contribution', [
      { k: 'who', label: 'Nom', req: true, half: true }, { k: 'amount', label: 'Montant (€)', type: 'number', half: true },
      { k: 'status', label: 'Statut', type: 'select', options: [['recu', 'Reçu'], ['promesse', 'Promesse (pas encore reçu)']], def: 'recu' },
      { k: 'note', label: 'Remarque' }
    ], c, function (v) {
      if (c) Object.assign(c, v); else ev.contributions.push(Object.assign({ id: uid('c') }, v));
    }, c ? { onDelete: function () { ev.contributions = ev.contributions.filter(function (e) { return e.id !== c.id; }); } } : null);
  }

  function formPerson(ev, x) {
    openForm(x ? 'Modifier la personne' : 'Ajouter une personne', [
      { k: 'name', label: 'Nom', req: true }, { k: 'cat', label: 'Catégorie', type: 'select', options: Object.keys(CATS).map(function (k) { return [k, CATS[k]]; }), def: 'membre', half: true },
      { k: 'invitedBy', label: 'Invité par', half: true }, { k: 'phone', label: 'Téléphone', type: 'tel', half: true },
      { k: 'registered', label: 'Inscrit', type: 'checkbox', def: true }, { k: 'note', label: 'Remarque' }
    ], x, function (v) {
      if (x) Object.assign(x, v); else ev.participants.push(Object.assign({ id: uid('u'), days: {} }, v));
    }, x ? { onDelete: function () { ev.participants = ev.participants.filter(function (e) { return e.id !== x.id; }); } } : null);
  }

  function formInc(ev, i, preset) {
    var vals = i || preset || {};
    if (!i && !vals.teamId && !isOrg()) vals.teamId = myTeam();
    openForm(i ? 'Modifier le problème' : 'Signaler un problème', [
      { k: 'title', label: 'Quel est le problème ?', req: true, ph: 'Ex. : le micro du pupitre ne marche plus' },
      { k: 'severity', label: 'Gravité', type: 'select', options: [['critique', 'Critique — il faut agir tout de suite'], ['moyen', 'Moyen — à régler rapidement'], ['faible', 'Faible — à surveiller']], def: 'moyen', half: true },
      { k: 'teamId', label: 'Équipe concernée', type: 'select', options: teamOptions(ev, true), half: true },
      { k: 'place', label: 'Où ?', half: true, ph: 'Salle, entrée, cuisine…' }, { k: 'owner', label: 'Qui s\'en occupe ?', half: true },
      { k: 'desc', label: 'Détails', type: 'textarea', rows: 2 },
      { k: 'action', label: 'Comment le corriger ?', type: 'textarea', rows: 2, ph: 'L\'action décidée pour régler le problème' },
      { k: 'status', label: 'État', type: 'select', options: [['ouvert', 'Ouvert'], ['encours', 'Pris en charge'], ['resolu', 'Résolu']], def: 'ouvert' }
    ], vals, function (v) {
      if (i) { if (v.status === 'resolu' && i.status !== 'resolu') i.resolvedAt = new Date().toISOString(); Object.assign(i, v); }
      else {
        ev.incidents.push(Object.assign({ id: uid('i'), at: new Date().toISOString(), by: actor(ev) }, v));
        log(ev, 'a signalé un problème : « ' + v.title + ' ».');
        toast('Problème signalé. Il apparaît en haut de la liste.');
      }
    }, i ? { onDelete: function () { ev.incidents = ev.incidents.filter(function (x) { return x.id !== i.id; }); } } : { saveLabel: 'Signaler' });
  }

  function formDuplicate(ev) {
    openForm('Réutiliser pour un prochain événement', [
      { type: 'note', k: '_n', html: 'On garde les équipes, les chefs, les missions avec leurs tâches (décochées) et le programme. Les dates suivent le nouveau premier jour. Tous les montants repartent à zéro (budgets demandés et accordés, dépenses, dons, objectif de collecte) : chaque équipe les donne de nouveau. Les présences et problèmes ne sont pas copiés.' },
      { k: 'name', label: 'Nom du nouvel événement', req: true, def: ev.name + ' (nouvelle édition)' },
      { k: 'start', label: 'Premier jour', type: 'date', req: true, def: addDays(ev.start, 365) }
    ], {}, function (v) {
      var shift = diffDays(ev.start, v.start), n = clone(ev), map = {};
      n.id = uid('ev'); n.name = v.name; n.start = v.start; n.end = addDays(ev.end || ev.start, shift); n.okDeadline = ev.okDeadline ? addDays(ev.okDeadline, shift) : addDays(v.start, -2);
      n.teams.forEach(function (t) { var o = t.id; t.id = uid('t'); map[o] = t.id; t.ok = null; t.refused = null; t.fin = null; t.alloc = null; });
      n.budget = 0; n.goal = 0; n.paypal = '';
      n.missions.forEach(function (m) { m.id = uid('m'); m.req = 0; m.reqDate = ''; m.alloc = null; m.teamId = map[m.teamId] || ''; m.done = false; m.question = ''; m.answer = ''; if (m.deadline) m.deadline = addDays(m.deadline, shift); m.subtasks.forEach(function (s) { s.id = uid('s'); s.done = false; if (s.due) s.due = addDays(s.due, shift); }); });
      n.program.forEach(function (p) { p.id = uid('p'); p.day = addDays(p.day, shift); p.done = false; p.teamId = map[p.teamId] || ''; });
      n.expenses = []; n.contributions = []; n.incidents = []; n.checkins = {}; n.log = []; n.files = []; n.meetings = [];
      n.participants.forEach(function (x) { x.id = uid('u'); x.days = {}; x.registered = false; });
      n.debrief = { good: '', improve: '', decisions: '' };
      state.events.push(n); state.eventId = n.id; ui.view = 'dash'; ui.evOpen = true;
      log(n, 'a créé l\'événement à partir de « ' + ev.name + ' ».');
      toast('Nouvel événement créé. Pensez aux leçons du bilan !');
    }, { saveLabel: 'Créer' });
  }

  /* ---------- WhatsApp et partage ---------- */
  function wa(text, phone) {
    var p = String(phone || '').replace(/[^\d+]/g, '');
    if (p.indexOf('00') === 0) p = p.slice(2);
    p = p.replace(/\+/g, '');
    window.open('https://wa.me/' + (p.length > 6 ? p : '') + '?text=' + encodeURIComponent(text), '_blank', 'noopener');
  }
  function teamSummary(ev, t) {
    var lines = [];
    teamMissions(ev, t.id).forEach(function (m) {
      var left = m.subtasks.filter(function (s) { return !s.done; });
      lines.push('• ' + m.title + ' : ' + mProg(m) + ' %' + (left.length ? ' (reste : ' + left.map(function (s) { return s.title; }).join(', ') + ')' : ''));
    });
    return lines.join('\n');
  }

  /* ---------- Actions (clics) ---------- */
  var ACT = {
    'go': function (el) { go(el.getAttribute('data-v')); },
    'go-target': function (el) { goTarget(el.getAttribute('data-g')); },
    'open-side': function () { $('#side').classList.add('open'); $('#scrim').classList.add('on'); },
    'close-side': closeSide,
    'close-modal': closeModal,
    'm-delete': function () { if (formCtx && formCtx.onDelete && formCtx.onDelete() !== false) { closeModal(); save(); render(); } },
    'open-event': function (el) { state.eventId = el.getAttribute('data-id'); ui.liveDay = null; ui.evOpen = true; save(); go(isOrg() ? 'dash' : 'myteam'); },
    'new-event': function () { if (isOrg()) formEvent(null); },
    'edit-event': function (el, ev) {
      if (!isOrg()) return;
      var id = el.getAttribute('data-id'), e = id ? state.events.filter(function (x) { return x.id === id; })[0] : ev;
      if (e) formEvent(e);
    },
    'del-event': function (el, ev) {
      if (!isOrg()) return;
      if (!confirm('Supprimer définitivement « ' + ev.name + ' » et toutes ses données ?')) return;
      dropFiles(ev, ev.files || []);
      state.events = state.events.filter(function (e) { return e.id !== ev.id; });
      state.eventId = state.events[0] ? state.events[0].id : null; save(); go('home');
    },
    'dup-event': function (el, ev) { formDuplicate(ev); },
    'new-team': function (el, ev) { formTeam(ev, null); },
    'add-ev-team': function (el, ev) { formAddTeam(ev); },
    'new-cat': function () { formCat(null); },
    'edit-cat': function (el) { formCat(catOf(el.getAttribute('data-id'))); },
    'pick-lead': function (el, ev) {
      var t = teamOf(ev, el.getAttribute('data-id'));
      openForm('Choisir le chef de « ' + t.name + ' »', [
        { type: 'note', k: '_n', html: 'Seul l\'organisateur choisit le chef. Le chef pourra ensuite ajouter et modifier les membres, mais pas changer de chef.' + (t.lead ? '<br>Chef actuel : <b>' + esc(t.lead) + '</b>.' : '') },
        { k: 'pick', label: 'Nouveau chef', type: 'select', options: t.people.map(function (p) { return [p.id, p.name + (p.role ? ' (' + p.role + ')' : '')]; }).concat([['new', '➕ Une autre personne…']]), def: t.people[0] ? t.people[0].id : 'new' },
        { k: 'name', label: 'Nom (si autre personne)', half: true }, { k: 'phone', label: 'Téléphone (si autre personne)', type: 'tel', half: true },
        { k: 'toCat', label: 'Garder aussi ce chef dans l\'équipe habituelle (prochains événements)', type: 'checkbox' }
      ], {}, function (v) {
        var p = v.pick !== 'new' ? t.people.filter(function (x) { return x.id === v.pick; })[0] : null;
        var name = p ? p.name : v.name, phone = p ? p.phone : v.phone;
        if (!name) { toast('Indiquez le nom du nouveau chef.'); return false; }
        if (t.lead && t.lead !== name) t.people.unshift({ id: uid('pm'), name: t.lead, phone: t.phone || '', role: 'Ancien chef' });
        if (p) t.people = t.people.filter(function (x) { return x.id !== p.id; });
        t.lead = name; t.phone = phone || '';
        var c = catOf(t.catId); if (v.toCat && c) { c.lead = t.lead; c.phone = t.phone; }
        log(ev, 'a nommé ' + name + ' chef de l\'équipe « ' + t.name + ' ».');
        toast(name + ' est maintenant chef de « ' + t.name + ' ».');
      }, { saveLabel: 'Nommer chef' });
    },
    'edit-team': function (el, ev) { formTeam(ev, teamOf(ev, el.getAttribute('data-id'))); },
    'open-team': function (el) { go(isOrg() ? 'team' : 'myteam', el.getAttribute('data-id')); },
    'new-mission': function (el, ev) { formMission(ev, null, el.getAttribute('data-team') || (ui.view === 'team' ? ui.teamId : '')); },
    'edit-mission': function (el, ev) { formMission(ev, findM(ev, el)); },
    'toggle-mission': function (el) { var id = el.getAttribute('data-m'); ui.open[id] = !ui.open[id]; render(); },
    'mfilter': function (el) { ui.mFilter = el.getAttribute('data-f'); render(); },
    'del-mission': function (el, ev) {
      var m = findM(ev, el);
      if (!confirm('Supprimer la mission « ' + m.title + ' » et ses ' + m.subtasks.length + ' tâche(s) ?')) return;
      ev.missions = ev.missions.filter(function (x) { return x.id !== m.id; });
      log(ev, 'a supprimé la mission « ' + m.title + ' ».'); save(); render(); toast('Mission supprimée.');
    },
    'del-sub': function (el, ev) {
      var m = findM(ev, el), s = m.subtasks.filter(function (x) { return x.id === el.getAttribute('data-s'); })[0];
      if (!confirm('Supprimer la tâche « ' + s.title + ' » ?')) return;
      m.subtasks = m.subtasks.filter(function (x) { return x.id !== s.id; });
      log(ev, 'a supprimé la tâche « ' + s.title + ' » (' + m.title + ').'); save(); render();
    },
    'edit-sub': function (el, ev) { var m = findM(ev, el); formSub(ev, m, m.subtasks.filter(function (s) { return s.id === el.getAttribute('data-s'); })[0]); },
    'ask': function (el, ev) {
      var m = findM(ev, el);
      openForm('Question à l\'organisateur', [{ k: 'question', label: 'Votre question', type: 'textarea', rows: 3, req: true, ph: 'Ex. : Combien de personnes pour le repas du samedi ?' }], m, function (v) {
        m.question = v.question; m.answer = ''; log(ev, 'a posé une question sur « ' + m.title + ' » : « ' + v.question + ' »');
      }, { saveLabel: 'Envoyer la question' });
    },
    'answer': function (el, ev) {
      var m = findM(ev, el);
      openForm('Répondre au chef', [{ type: 'note', k: '_n', html: '<b>Question :</b> ' + esc(m.question) }, { k: 'answer', label: 'Votre réponse', type: 'textarea', rows: 3, req: true }], m, function (v) {
        m.answer = v.answer; log(ev, 'a répondu à la question sur « ' + m.title + ' ».');
      });
    },
    'send-ok': function (el, ev) {
      var t = teamOf(ev, el.getAttribute('data-id')), p = tProg(ev, t.id);
      if (!isLead() || p < 100) { toast('Le OK vert est possible quand toutes les tâches sont faites (100 %).'); return; }
      if (!confirm('Envoyer votre OK ? Vous confirmez que tout est prêt pour « ' + t.name + ' ».')) return;
      t.ok = { at: new Date().toISOString(), reserve: false, note: '' }; t.refused = null;
      log(ev, 'a envoyé son OK : tout est prêt.');
      save(); render(); toast('OK envoyé. Merci ! Prévenez aussi l\'organisateur par WhatsApp.');
    },
    'send-reserve': function (el, ev) {
      var t = teamOf(ev, el.getAttribute('data-id')), p = tProg(ev, t.id), left = openItems(ev, t.id);
      if (!isLead()) return;
      var fields = [{ type: 'note', k: '_n', html: 'Votre équipe est à <b>' + p + ' %</b>. Pour chaque tâche pas encore finie, dites <b>pourquoi</b> et <b>la solution prévue</b>. L\'organisateur acceptera ou refusera votre réserve.' }];
      left.forEach(function (x, i) {
        fields.push({ type: 'note', k: '_t' + i, html: '<div class="res-title">' + (i + 1) + '. ' + esc(x.title) + '</div>' });
        fields.push({ k: 'why_' + i, label: 'Pourquoi ce n\'est pas fini ?', type: 'textarea', rows: 2, req: true, half: true });
        fields.push({ k: 'fix_' + i, label: 'Solution prévue', type: 'textarea', rows: 2, req: true, half: true });
      });
      fields.push({ k: 'note', label: 'Autre remarque (facultatif)', type: 'textarea', rows: 2 });
      openForm('OK avec réserve', fields, {}, function (v) {
        t.ok = { at: new Date().toISOString(), reserve: true, status: 'pending', note: v.note || '',
          items: left.map(function (x, i) { return { id: x.id, title: x.title, why: v['why_' + i], fix: v['fix_' + i] }; }) };
        t.refused = null;
        log(ev, 'a envoyé un OK avec réserve (' + left.length + ' tâche(s) pas finie(s)).');
        toast('OK avec réserve envoyé. L\'organisateur doit l\'accepter.');
      }, { saveLabel: 'Envoyer le OK avec réserve' });
    },
    'accept-res': function (el, ev) {
      var t = teamOf(ev, el.getAttribute('data-id'));
      if (!isOrg() || !t.ok) return;
      t.ok.status = 'accepted'; t.ok.acceptedAt = new Date().toISOString();
      log(ev, 'a accepté la réserve de l\'équipe « ' + t.name + ' ».');
      save(); render(); toast('Réserve acceptée : « ' + t.name + ' » compte comme prête.');
    },
    'refuse-res': function (el, ev) {
      var t = teamOf(ev, el.getAttribute('data-id'));
      if (!isOrg() || !t.ok) return;
      openForm('Refuser la réserve de « ' + t.name + ' »', [
        { type: 'note', k: '_n', html: 'Le OK revient « en attente ». Le chef voit votre message sur sa page, et WhatsApp s\'ouvre pour le prévenir.' },
        { k: 'note', label: 'Pourquoi ? Ce qu\'il faut encore faire', type: 'textarea', rows: 3, req: true }
      ], {}, function (v) {
        t.ok = null; t.refused = { at: new Date().toISOString(), note: v.note };
        log(ev, 'a refusé la réserve de l\'équipe « ' + t.name + ' » : « ' + v.note + ' ».');
        wa('Bonjour ' + (t.lead || '') + ', ta réserve pour l\'équipe ' + t.name + ' (« ' + ev.name + ' ») n\'est pas acceptée :\n' + v.note + '\n\nMerci de finir ces points puis de renvoyer ton OK.', t.phone);
      }, { saveLabel: 'Refuser et prévenir le chef' });
    },
    'cancel-ok': function (el, ev) { var t = teamOf(ev, el.getAttribute('data-id')); t.ok = null; log(ev, 'a retiré son OK.'); save(); render(); },
    'wa-ok': function (el, ev) {
      var t = teamOf(ev, el.getAttribute('data-id'));
      var it = t.ok && t.ok.items ? t.ok.items : [];
      wa((t.ok && t.ok.reserve ? '🟠 OK avec réserve' : '✅ OK') + ' de l\'équipe ' + t.name + ' pour « ' + ev.name + ' » (' + tProg(ev, t.id) + ' % prêt).' +
        (it.length ? '\n\nPas encore fini :\n' + it.map(function (x) { return '• ' + x.title + '\n  Pourquoi : ' + x.why + '\n  Solution : ' + x.fix; }).join('\n') : '') +
        (t.ok && t.ok.note ? '\nRemarque : ' + t.ok.note : '') + (t.ok && t.ok.reserve ? '\n\nMerci d\'accepter ou de refuser la réserve dans l\'application.' : '\n\n' + teamSummary(ev, t)));
    },
    'wa-mission': function (el, ev) {

    var ua = navigator.userAgent, h;
    if (isIOS) h = '<b>iPhone / iPad :</b> ouvrez cette page dans <b>Safari</b>, touchez <b>Partager</b> (le carré avec une flèche vers le haut), puis <b>« Sur l\'écran d\'accueil »</b> et <b>Ajouter</b>.';
    else if (isMacSafari) h = '<b>Mac avec Safari :</b> dans la barre de menus tout en haut de l\'écran, cliquez sur <b>Fichier</b> puis <b>« Ajouter au Dock… »</b>, puis <b>Ajouter</b>. L\'icône apparaît dans le Dock et dans le dossier Applications.<br><small>Si « Ajouter au Dock » n\'apparaît pas, mettez à jour macOS (Sonoma ou plus récent) ou utilisez Google Chrome.</small>';
    else if (/Android/.test(ua)) h = '<b>Android :</b> dans <b>Chrome</b>, touchez le menu <b>⋮</b> en haut à droite, puis <b>« Installer l\'application »</b> (ou « Ajouter à l\'écran d\'accueil »).';
    else if (isFirefox) h = '<b>Firefox</b> ne sait pas installer les applications web sur ordinateur : ouvrez cette page dans <b>Google Chrome</b>, <b>Microsoft Edge</b> ou, sur Mac, <b>Safari</b>.';
    else h = '<b>Ordinateur (Chrome ou Edge) :</b> cliquez sur l\'icône <b>Installer</b> (un petit écran avec une flèche) à droite dans la barre d\'adresse. Sinon : menu <b>⋮</b> › <b>« Enregistrer et partager »</b> (ou « Caster, enregistrer et partager ») › <b>« Installer la page en tant qu\'application… »</b>.';
    return h;
  }
  function installLink() { return canInstall() ? ' · <button class="link-btn" data-act="go" data-v="settings">📲 Installer</button>' : ''; }
  function installCard() {
    if (!canInstall()) return '';
    var h = '<div class="card install-card"><div class="install-ic"><img src="' + ($('.brand-logo') || {}).src + '" alt=""></div><div class="install-tx"><h2>Installer l\'application</h2>';
    h += '<p>Event Manager Pro s\'ajoute sur votre écran d\'accueil ou dans le Dock de votre ordinateur, et s\'ouvre comme une vraie application, même sans réseau.</p>';
    if (deferredInstall) h += '<div class="m-actions">' + btn('📲 Installer maintenant', 'install', 'btn-gold btn-lg') + '</div>';
    else h += '<p class="install-how">' + installHelp() + '</p>';
    return h + '</div></div>';
  }
  function paintInstall() {
    var show = canInstall();
    ['#side-install', '#top-install'].forEach(function (s) { var b = $(s); if (b) b.hidden = !show; });
  }
  ACT.install = function () {
    if (!deferredInstall) {
      var box = $('#cl-install-help');
      if (CL.el && !CL.el.hidden && box) { box.hidden = !box.hidden; return; }
      openForm('Installer l\'application', [{ type: 'note', k: '_n', html: '<p>' + installHelp() + '</p><p class="small muted mt">Une fois installée, Event Manager Pro s\'ouvre depuis son icône, comme une vraie application.</p>' }], {}, function () {}, { saveLabel: 'Fermer' });
      return;
    }
    deferredInstall.prompt();
    deferredInstall.userChoice.then(function () { deferredInstall = null; render(); }, noop);
  };
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').then(function (reg) {
        reg.addEventListener('updatefound', function () {
          var w = reg.installing;
          if (w) w.addEventListener('statechange', function () { if (w.state === 'installed' && navigator.serviceWorker.controller) toast('Nouvelle version prête : fermez puis rouvrez l\'application.'); });
        });
      }).catch(noop);
    });
  }

  /* ----- Démarrage ----- */
  function cloudStart() {
    var m = /[?&]invite=([A-Za-z0-9]+)/.exec(location.search);
    if (m) {
      try { sessionStorage.setItem('emp_invite', m[1].toUpperCase()); } catch (e) { CL.invite = m[1].toUpperCase(); }
      try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) { /* rien */ }
    }
    try { CL.invite = CL.invite || sessionStorage.getItem('emp_invite'); } catch (e) { /* rien */ }
    if (!Cloud.configured()) { render(); return; }
    var local = lsGet(KEY + '_mode') === 'local' && !CL.invite, last = lsGet(KEY + '_space');
    if (local) render(); else clShow('<p class="muted cl-wait">Connexion…</p>');
    Cloud.onAuth(function (ev) { if (ev === 'PASSWORD_RECOVERY') clNewPw(); });
    Cloud.init().then(function () {
      if (local) return;
      if (!Cloud.user()) {
        CL.mode = CL.invite ? 'signup' : 'signin'; clAuth();
        loadInvite().then(function () { var b = $('#cl-inv'); if (b) b.outerHTML = inviteBanner(); });
        return;
      }
      afterLogin();
    }).catch(function () {
      if (local) return;
      if (last && lsGet(KEY + '_cloud_' + last)) openSpace(last).catch(noop);
      else { clHide(); render(); toast('Pas de connexion internet : vous travaillez sur cet appareil.'); }
    });
  }

  /* ---------- Branchements ---------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    if (el.tagName === 'A') e.preventDefault();
    var fn = ACT[el.getAttribute('data-act')];
    if (fn) fn(el, curEv());
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !$('#modal').hidden) closeModal();
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.card[data-act]')) { e.preventDefault(); e.target.click(); }
  });
  document.addEventListener('change', function (e) {
    var el = e.target, k = el.getAttribute && el.getAttribute('data-chg');
    if (!k || !CHG[k]) return;
    var r = CHG[k](el, curEv());
    save(); if (r !== 'norender') render();
  });
  document.addEventListener('input', function (e) {
    if (e.target.getAttribute('data-input') === 'people-filter') {
      var q = e.target.value.trim().toLowerCase();
      document.querySelectorAll('#people-tbl tbody tr').forEach(function (tr) { tr.style.display = !q || tr.getAttribute('data-name').indexOf(q) >= 0 ? '' : 'none'; });
    }
  });
  document.addEventListener('submit', function (e) {
    var f = e.target;
    if (f.id === 'cl-form') { e.preventDefault(); clSubmit(f); return; }
    if (f.id === 'm-form') {
      e.preventDefault();
      if (!formCtx) return;
      var v = readForm(); if (!v) return;
      var cb = formCtx.onSave;
      closeModal();
      if (cb(v) !== false) { save(); render(); }
      return;
    }
    if (f.getAttribute('data-form') === 'add-member') {
      e.preventDefault();
      var ev2 = curEv(), t2 = teamOf(ev2, f.getAttribute('data-team')), nm = f.querySelector('[name=name]');
      if (!nm.value.trim()) { nm.classList.add('is-invalid'); nm.focus(); setTimeout(function () { nm.classList.remove('is-invalid'); }, 1200); return; }
      var np = { id: uid('pm'), name: nm.value.trim(), role: f.querySelector('[name=role]').value.trim(), phone: f.querySelector('[name=phone]').value.trim() };
      t2.people.push(np);
      log(ev2, 'a ajouté ' + np.name + ' à l\'équipe « ' + t2.name + ' ».');
      save(); render(); toast(np.name + ' fait maintenant partie de l\'équipe « ' + t2.name + ' ».');
      var again2 = document.querySelector('form[data-form="add-member"] [name=name]'); if (again2) again2.focus();
      return;
    }
    if (f.getAttribute('data-form') === 'add-contrib') {
      e.preventDefault();
      var ev3 = curEv(), who = f.querySelector('[name=who]'), am = f.querySelector('[name=amount]'), amount = parseFloat(String(am.value).replace(',', '.')) || 0;
      if (!who.value.trim() || amount <= 0) { (who.value.trim() ? am : who).classList.add('is-invalid'); setTimeout(function () { who.classList.remove('is-invalid'); am.classList.remove('is-invalid'); }, 1200); return; }
      ev3.contributions.push({ id: uid('c'), who: who.value.trim(), amount: amount, status: 'recu', note: '', at: new Date().toISOString() });
      log(ev3, 'a noté un don reçu de ' + who.value.trim() + ' (' + fmtMoney(amount) + ').');
      save(); render(); toast('Don de ' + fmtMoney(amount) + ' noté. Merci !');
      var again3 = document.querySelector('form[data-form="add-contrib"] [name=who]'); if (again3) again3.focus();
      return;
    }
    if (f.getAttribute('data-form') === 'add-sub') {
      e.preventDefault();
      var ev = curEv(), m = findM(ev, f), inp = f.querySelector('input'), title = inp.value.trim();
      if (!title) { inp.classList.add('is-invalid'); setTimeout(function () { inp.classList.remove('is-invalid'); }, 1200); return; }
      m.subtasks.push({ id: uid('s'), title: title, done: false, who: '', due: '' });
      if (m.done) m.done = false;
      log(ev, 'a ajouté la tâche « ' + title + ' » (' + m.title + ').');
      resetOk(ev, m.teamId, 'nouvelle tâche ajoutée');
      save(); render();
      var again = document.querySelector('form[data-m="' + m.id + '"] input'); if (again) again.focus();
    }
  });
  function setRole(v) {
    var p = v.split(':');
    state.role = v === 'org' ? { kind: 'org' } : { kind: p[0], catId: p[1] };
    ui.view = v === 'org' ? (ui.evOpen ? 'dash' : 'home') : 'myteam'; if (v !== 'org') ui.evOpen = true;
    save(); closeSide(); render(); window.scrollTo(0, 0);
    var c = v === 'org' ? null : catOf(p[1]), t = c && teamByCat(curEv(), c.id);
    toast(!c ? 'Vous êtes l\'organisateur général.' : p[0] === 'lead' ? 'Vous voyez l\'application comme ' + ((t || c).lead || 'le chef') + ', chef de « ' + c.name + ' ».' : 'Vous voyez l\'application comme un membre de « ' + c.name + ' ».');
  }
  $('#role-sel').addEventListener('change', function (e) {
    var v = e.target.value;
    if (v === 'org' && !isOrg() && state.orgPin) {
      e.target.value = state.role.kind + ':' + state.role.catId;
      openForm('Code organisateur', [{ k: 'pin', label: 'Entrez le code organisateur', type: 'password', req: true }], {}, function (f) {
        if (f.pin !== state.orgPin) { toast('Code incorrect.'); return false; }
        setRole('org');
      }, { saveLabel: 'Entrer' });
      return;
    }
    setRole(v);
  });
  $('#ev-sel').addEventListener('change', function (e) {
    ui.liveDay = null;
    if (!e.target.value) { save(); go('home'); return; }
    state.eventId = e.target.value; ui.evOpen = true; save(); go(isOrg() ? 'dash' : 'myteam');
  });
  $('#import-file').addEventListener('change', function (e) {
    var file = e.target.files[0]; if (!file) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var s = JSON.parse(rd.result);
        if (!s || s.v !== 2 || !Array.isArray(s.events)) throw new Error('format');
        migrate(s);
        if (!confirm('Remplacer les données de cet appareil par celles du fichier « ' + file.name + ' » ?')) return;
        state = s; ui.view = null; save(); render(); toast('Sauvegarde importée.');
      } catch (err) { toast('Ce fichier n\'est pas une sauvegarde Event Manager Pro.'); }
      e.target.value = '';
    };
    rd.readAsText(file);
  });
  var toastT;
  function toast(msg) { var t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('on'); }, 3200); }

  // Le jour J, l'écran en direct se met à jour chaque minute.
  setInterval(function () { if (ui.view === 'live' && $('#modal').hidden && !document.activeElement.matches('input,textarea,select')) render(); }, 60000);

  cloudStart();
  window.EMP = { state: function () { return state; }, version: APP_VERSION, cloud: ON, save: function () { save(); render(); }, decompose: function () { return decompose(state); } };
})();
</script>
</body>
</html>
